# 开发环境（可提交：非敏感默认值，密钥走环境变量）
# 启动：SPRING_PROFILES_ACTIVE=dev ./mvnw spring-boot:run
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/chip?characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.babata.chip: DEBUG
    org.springframework.web: INFO
