<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 页面未找到</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow: hidden;
        }

        .container {
            text-align: center;
            animation: fadeIn 2s ease-in-out;
        }

        .glitch {
            font-size: 8rem;
            font-weight: bold;
            position: relative;
            color: white;
        }

        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            color: white;
            background: transparent;
            overflow: hidden;
        }

        .glitch::before {
            left: 2px;
            text-shadow: -2px 0 red;
            animation: glitch 1s infinite linear alternate-reverse;
        }

        .glitch::after {
            left: -2px;
            text-shadow: -2px 0 blue;
            animation: glitch 1.2s infinite linear alternate-reverse;
        }

        h2 {
            margin-top: 20px;
            font-size: 2rem;
            opacity: 0.85;
        }

        a {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 20px;
            color: white;
            border: 2px solid white;
            text-decoration: none;
            border-radius: 30px;
            transition: all 0.3s ease;
        }

        a:hover {
            background: white;
            color: #2c5364;
        }

        @keyframes glitch {
            0% {
                clip: rect(0, 900px, 0, 0);
            }
            10% {
                clip: rect(10px, 900px, 40px, 0);
            }
            20% {
                clip: rect(20px, 900px, 60px, 0);
            }
            30% {
                clip: rect(10px, 900px, 40px, 0);
            }
            40% {
                clip: rect(0px, 900px, 20px, 0);
            }
            50% {
                clip: rect(30px, 900px, 50px, 0);
            }
            60% {
                clip: rect(10px, 900px, 40px, 0);
            }
            70% {
                clip: rect(20px, 900px, 60px, 0);
            }
            80% {
                clip: rect(10px, 900px, 40px, 0);
            }
            90% {
                clip: rect(0px, 900px, 20px, 0);
            }
            100% {
                clip: rect(30px, 900px, 50px, 0);
            }
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: scale(0.9);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="glitch" data-text="404">404</div>
    <h2>页面找不到了</h2>
    <a href="/">返回首页</a>
</div>
</body>
</html>
