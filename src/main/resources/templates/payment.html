<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账户充值 - 支付中心</title>
    <!-- 引入Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- 配置Tailwind自定义主题 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1677ff',
                        success: '#52c41a',
                        warning: '#faad14',
                        danger: '#ff4d4f',
                        neutral: {
                            100: '#f5f5f5',
                            200: '#e5e5e5',
                            300: '#d9d9d9',
                            400: '#8c8c8c',
                            500: '#595959',
                            600: '#262626',
                            700: '#1f1f1f',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .card-shadow {
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            }
            .btn-hover {
                transition: all 0.3s ease;
            }
            .btn-hover:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 12px rgba(22, 119, 255, 0.2);
            }
        }
    </style>
</head>
<body class="bg-neutral-100 min-h-screen">
<!-- 顶部导航 -->
<header class="bg-white shadow-sm sticky top-0 z-10">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <i class="fa fa-credit-card text-primary text-2xl"></i>
            <h1 class="text-xl font-bold text-neutral-700">支付中心</h1>
        </div>
        <div class="flex items-center space-x-4">
            <span class="text-neutral-500 hidden md:inline-block">欢迎，<span class="text-primary font-medium" th:text="${username}">用户名</span></span>
            <a href="#" class="text-neutral-500 hover:text-primary transition-colors">
                <i class="fa fa-user-circle-o text-lg"></i>
            </a>
        </div>
    </div>
</header>

<!-- 主要内容 -->
<main class="container mx-auto px-4 py-8">
    <!-- 面包屑 -->
    <div class="mb-6 text-sm text-neutral-500">
        <a href="#" class="hover:text-primary">首页</a> &gt;
        <span class="text-primary">账户充值</span>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- 充值面板 -->
        <div class="lg:col-span-2">
            <div class="bg-white rounded-lg card-shadow p-6">
                <h2 class="text-xl font-bold text-neutral-700 mb-6">账户充值</h2>

                <form id="rechargeForm">
                    <!-- 充值金额 -->
                    <div class="mb-6">
                        <label class="block text-neutral-700 mb-2">充值金额</label>
                        <div class="flex">
                            <input type="number" id="amount" name="amount" min="0.01" step="0.01"
                                   class="flex-1 px-4 py-2 border border-neutral-300 rounded-l-lg focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary transition-all"
                                   placeholder="请输入充值金额" required>
                            <span class="px-4 py-2 bg-neutral-100 border border-l-0 border-neutral-300 rounded-r-lg text-neutral-700">元</span>
                        </div>
                        <p class="text-neutral-500 text-sm mt-2">最小充值金额为0.01元</p>
                    </div>

                    <!-- 快捷金额 -->
                    <div class="mb-8">
                        <label class="block text-neutral-700 mb-2">快捷充值</label>
                        <div class="flex flex-wrap gap-3">
                            <button type="button" class="px-4 py-2 bg-neutral-100 hover:bg-primary hover:text-white rounded-lg transition-colors quick-amount" data-amount="10">10元</button>
                            <button type="button" class="px-4 py-2 bg-neutral-100 hover:bg-primary hover:text-white rounded-lg transition-colors quick-amount" data-amount="50">50元</button>
                            <button type="button" class="px-4 py-2 bg-neutral-100 hover:bg-primary hover:text-white rounded-lg transition-colors quick-amount" data-amount="100">100元</button>
                            <button type="button" class="px-4 py-2 bg-neutral-100 hover:bg-primary hover:text-white rounded-lg transition-colors quick-amount" data-amount="200">200元</button>
                            <button type="button" class="px-4 py-2 bg-neutral-100 hover:bg-primary hover:text-white rounded-lg transition-colors quick-amount" data-amount="500">500元</button>
                        </div>
                    </div>

                    <!-- 支付方式 -->
                    <div class="mb-8">
                        <label class="block text-neutral-700 mb-2">支付方式</label>
                        <div class="border border-neutral-300 rounded-lg p-4">
                            <label class="flex items-center space-x-3 cursor-pointer">
                                <input type="radio" name="payType" value="alipay" checked class="w-5 h-5 accent-primary">
                                <div class="flex items-center space-x-2">
                                    <i class="fa fa-alipay text-blue-500 text-xl"></i>
                                    <span class="text-neutral-700">支付宝支付</span>
                                </div>
                            </label>
                        </div>
                    </div>

                    <!-- 提交按钮 -->
                    <button type="button" id="rechargeBtn" class="w-full bg-primary text-white py-3 rounded-lg font-medium btn-hover flex items-center justify-center">
                        <i class="fa fa-money mr-2"></i>
                        立即充值
                    </button>
                </form>
            </div>

            <!-- 充值记录 -->
            <div class="bg-white rounded-lg card-shadow p-6 mt-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold text-neutral-700">充值记录</h2>
                    <a href="#" class="text-primary hover:text-primary/80 text-sm">查看全部</a>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead>
                        <tr class="border-b border-neutral-200">
                            <th class="text-left py-3 text-neutral-500 font-normal">订单号</th>
                            <th class="text-left py-3 text-neutral-500 font-normal">金额</th>
                            <th class="text-left py-3 text-neutral-500 font-normal">状态</th>
                            <th class="text-left py-3 text-neutral-500 font-normal">创建时间</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="record : ${orders}" class="border-b border-neutral-100 hover:bg-neutral-50">
                            <td class="py-4 text-neutral-700" th:text="${record.orderId}">20251214001</td>
                            <td class="py-4 text-neutral-700" th:text="${'¥' + record.amount}">¥100.00</td>
                            <td class="py-4">
                                        <span th:switch="${record.status}" class="px-2 py-1 rounded-full text-xs font-medium">
                                            <span th:case="0" class="bg-neutral-200 text-neutral-600">待支付</span>
                                            <span th:case="1" class="bg-success/10 text-success">支付成功</span>
                                            <span th:case="2" class="bg-danger/10 text-danger">支付失败</span>
                                            <span th:default class="bg-neutral-200 text-neutral-600">未知</span>
                                        </span>
                            </td>
                            <td class="py-4 text-neutral-500" th:text="${record.createTime}">2025-12-14 10:00:00</td>
                        </tr>
                        <!-- 空状态 -->
                        <tr th:if="${#lists.isEmpty(orders)}">
                            <td colspan="4" class="py-8 text-center text-neutral-500">
                                <i class="fa fa-file-text-o text-4xl mb-2"></i>
                                <p>暂无充值记录</p>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 账户信息面板 -->
        <div class="lg:col-span-1">
            <div class="bg-white rounded-lg card-shadow p-6 sticky top-24">
                <h2 class="text-xl font-bold text-neutral-700 mb-6">账户信息</h2>

                <!-- 账户余额 -->
                <div class="mb-8 text-center">
                    <p class="text-neutral-500 mb-2">当前账户余额</p>
                    <div class="text-3xl font-bold text-primary" th:text="${'¥' + totalBalance}">¥0.00</div>
                </div>

                <!-- 充值说明 -->
                <div class="border-t border-neutral-200 pt-6">
                    <h3 class="font-medium text-neutral-700 mb-3">充值说明</h3>
                    <ul class="text-neutral-500 text-sm space-y-2">
                        <li class="flex items-start">
                            <i class="fa fa-info-circle text-primary mt-1 mr-2"></i>
                            <span>充值金额将实时到账，如有延迟请联系客服</span>
                        </li>
                        <li class="flex items-start">
                            <i class="fa fa-info-circle text-primary mt-1 mr-2"></i>
                            <span>支持支付宝快捷支付，单笔充值无上限</span>
                        </li>
                        <li class="flex items-start">
                            <i class="fa fa-info-circle text-primary mt-1 mr-2"></i>
                            <span>充值成功后可在充值记录中查看详情</span>
                        </li>
                        <li class="flex items-start">
                            <i class="fa fa-info-circle text-primary mt-1 mr-2"></i>
                            <span>如有任何问题，请联系客服：400-123-4567</span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- 页脚 -->
<footer class="bg-white mt-12 border-t border-neutral-200">
    <div class="container mx-auto px-4 py-8 text-center text-neutral-500 text-sm">
        <p>© 2025 支付中心 版权所有</p>
    </div>
</footer>

<!-- 加载弹窗 -->
<div id="loadingModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-lg p-6 flex flex-col items-center">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary mb-4"></div>
        <p class="text-neutral-700">正在跳转支付宝支付...</p>
    </div>
</div>

<!-- 支付宝表单容器（隐藏） -->
<div id="alipayFormContainer" class="hidden"></div>

<script>
    // 快捷金额选择
    document.querySelectorAll('.quick-amount').forEach(btn => {
        btn.addEventListener('click', function() {
            const amount = this.dataset.amount;
            document.getElementById('amount').value = amount;

            // 高亮选中的金额
            document.querySelectorAll('.quick-amount').forEach(b => {
                b.classList.remove('bg-primary', 'text-white');
                b.classList.add('bg-neutral-100');
            });
            this.classList.remove('bg-neutral-100');
            this.classList.add('bg-primary', 'text-white');
        });
    });

    // 表单提交逻辑（改为AJAX提交）
    document.getElementById('rechargeBtn').addEventListener('click', async function() {
        const amountInput = document.getElementById('amount');
        const amount = parseFloat(amountInput.value);

        // 基础验证
        if (!amount || amount < 0.01) {
            alert('请输入有效的充值金额（最小0.01元）');
            return;
        }

        // 显示加载弹窗
        const loadingModal = document.getElementById('loadingModal');
        loadingModal.classList.remove('hidden');

        // 禁用按钮防止重复点击
        this.disabled = true;
        this.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i> 处理中...';

        try {
            // 发送AJAX请求获取支付宝表单
            const response = await fetch('/api/payment/alipay/create', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `amount=${amount}`
            });

            if (!response.ok) {
                throw new Error('请求失败，请重试');
            }

            // 解析后端返回的JSON
            const result = await response.json();

            if (result.status === 0 && result.data) {
                // 将支付宝返回的表单插入到页面并自动提交
                const formContainer = document.getElementById('alipayFormContainer');
                formContainer.innerHTML = result.data;
                // 自动提交表单跳转到支付宝
                const form = document.forms['punchout_form'];
                if (form) {
                    form.submit();
                }
            } else {
                alert('创建支付订单失败：' + (result.message || '未知错误'));
            }
        } catch (error) {
            console.error('支付请求失败：', error);
            alert('支付请求失败，请稍后重试');
        } finally {
            // 恢复按钮状态（如果请求失败）
            if (loadingModal.classList.contains('hidden') === false) {
                this.disabled = false;
                this.innerHTML = '<i class="fa fa-money mr-2"></i> 立即充值';
                loadingModal.classList.add('hidden');
            }
        }
    });

    // 页面加载完成后检查支付结果
    document.addEventListener('DOMContentLoaded', function() {
        // 获取URL中的支付结果参数
        const urlParams = new URLSearchParams(window.location.search);
        const payResult = urlParams.get('payResult');

        if (payResult === 'success') {
            alert('充值成功！您的余额已更新');
            // 清除URL参数
            window.history.replaceState({}, document.title, window.location.pathname);
            // 可选：刷新页面获取最新余额和记录
            // window.location.reload();
        } else if (payResult === 'fail') {
            alert('充值失败，请重试');
            window.history.replaceState({}, document.title, window.location.pathname);
        }
    });
</script>
</body>
</html>
