<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="layouts/base :: head-common"/>
    <link rel="stylesheet" th:href="@{/static/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/static/css/blog.css(v=20260809-1)}">
    <title>Blog | Barbot Newsletter</title>
</head>
<body>
<nav th:replace="layouts/base :: navbar"></nav>

<main class="newsletter-page">
    <section class="newsletter-cover" aria-labelledby="newsletter-title">
        <div class="cover-orbit" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="newsletter-mark" aria-hidden="true">B/</div>
        <p class="publication-kicker">BARBOT · FIELD NOTES</p>
        <h1 id="newsletter-title">Barbot<br><em>Newsletter</em></h1>
        <p class="publication-deck">关于芯片、Agent 与真实工作的持续记录。<br>从一线场景出发，写下产品、方法和正在发生的变化。</p>
        <p class="publication-byline">By Barbot · Build the better agent.</p>

        <div class="subscribe-panel" aria-label="订阅 Barbot Newsletter">
            <div>
                <p>订阅每一期</p>
                <span>产品进展、芯片实践与 Agent 判断，直接送达。</span>
            </div>
            <a class="subscribe-button" href="https://nauucreazyboy.substack.com/" target="_blank" rel="noopener noreferrer">订阅 Newsletter <span aria-hidden="true">↗</span></a>
        </div>
    </section>

    <section class="newsletter-stream" id="blog-list" aria-labelledby="stream-title">
        <header class="stream-header">
            <div><p class="section-kicker">THE LATEST</p><h2 id="stream-title">最新文章</h2></div>
            <a class="stream-subscribe" href="https://nauucreazyboy.substack.com/" target="_blank" rel="noopener noreferrer">在 Substack 订阅 <span aria-hidden="true">↗</span></a>
        </header>

        <div class="blog-filters" id="categories" aria-label="文章分类"></div>
        <div class="post-stream" id="blog-grid" aria-live="polite">
            <div class="loading-indicator"><i class="fas fa-spinner"></i> 正在加载文章…</div>
        </div>
        <div class="pagination" id="pagination"></div>
    </section>
</main>

<footer th:replace="layouts/base :: footer"></footer>
<th:block th:replace="layouts/base :: scripts-common"/>

<script>
    $(document).ready(function () {
        let currentPage = 1;
        let currentCategory = '全部';
        const postsPerPage = 9;
        const categories = ['全部', '产品进展', '芯片实践', 'Agent 方法', '创业笔记', '行业观察'];

        function escapeHtml(value) {
            return $('<div>').text(value || '').html();
        }

        function fetchBlogPosts(page, category) {
            return $.ajax({
                url: '/api/article/posts', method: 'GET', dataType: 'json',
                data: {page: page, pageSize: postsPerPage, tag: category === '全部' ? null : category}
            });
        }

        function renderCategories() {
            $('#categories').html(categories.map(function (category) {
                return `<button class="filter-btn ${category === currentCategory ? 'active' : ''}" type="button" data-category="${category}">${category}</button>`;
            }).join(''));
        }

        function renderBlogPosts(posts) {
            const $stream = $('#blog-grid');
            if (!posts.length) {
                $stream.html('<div class="no-results">这一分类暂时还没有文章。<button type="button" class="reset-filter">查看全部文章</button></div>');
                return;
            }
            $stream.html(posts.map(function (post, index) {
                const title = escapeHtml(post.title || '未命名文章');
                const summary = escapeHtml(post.summary || '点击阅读全文。');
                const tag = escapeHtml(post.tag || 'BARBOT NOTES');
                const date = escapeHtml(post.createTime || '');
                const articleKey = post.enTitle || post.id;
                const href = `/article/${encodeURIComponent(articleKey)}`;
                const image = post.coverImage ? `<img src="${escapeHtml(post.coverImage)}" alt="" loading="${index < 2 ? 'eager' : 'lazy'}">` : '<span class="post-placeholder" aria-hidden="true">B/</span>';
                return `<article class="post-entry ${index === 0 ? 'post-entry-featured' : ''}"><a href="${href}" class="post-link"><div class="post-number">${String((currentPage - 1) * postsPerPage + index + 1).padStart(2, '0')}</div><div class="post-copy"><p class="post-tag">${tag}</p><h3>${title}</h3><p class="post-summary">${summary}</p><div class="post-meta"><span>${date}</span><span>阅读全文 <b aria-hidden="true">↗</b></span></div></div><div class="post-image">${image}</div></a></article>`;
            }).join(''));
        }

        function renderPagination(totalPages) {
            const $pagination = $('#pagination');
            if (totalPages <= 1) { $pagination.empty(); return; }
            let markup = `<button class="page-btn" type="button" data-page="${currentPage - 1}" ${currentPage === 1 ? 'disabled' : ''}>←</button>`;
            for (let page = 1; page <= totalPages; page++) {
                markup += `<button class="page-btn ${page === currentPage ? 'active' : ''}" type="button" data-page="${page}">${page}</button>`;
            }
            markup += `<button class="page-btn" type="button" data-page="${currentPage + 1}" ${currentPage === totalPages ? 'disabled' : ''}>→</button>`;
            $pagination.html(markup);
        }

        function loadBlogData(page, category) {
            $('#blog-grid').html('<div class="loading-indicator"><i class="fas fa-spinner"></i> 正在加载文章…</div>');
            fetchBlogPosts(page, category).done(function (response) {
                if (response.status !== 0) {
                    $('#blog-grid').html('<div class="no-results">文章加载失败，请稍后重试。<button class="retry-posts" type="button">重新加载</button></div>');
                    return;
                }
                currentPage = page;
                currentCategory = category;
                renderCategories();
                renderBlogPosts(response.data || []);
                renderPagination(Math.ceil((response.total || 0) / postsPerPage));
            }).fail(function () {
                $('#blog-grid').html('<div class="no-results">文章加载失败，请稍后重试。<button class="retry-posts" type="button">重新加载</button></div>');
            });
        }

        $(document).on('click', '.filter-btn', function () { loadBlogData(1, $(this).data('category')); });
        $(document).on('click', '.page-btn:not(:disabled)', function () { loadBlogData($(this).data('page'), currentCategory); });
        $(document).on('click', '.reset-filter', function () { loadBlogData(1, '全部'); });
        $(document).on('click', '.retry-posts', function () { loadBlogData(currentPage, currentCategory); });
        loadBlogData(1, currentCategory);
    });
</script>
</body>
</html>
