<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHIP - Pin2Pin智能替代分析平台</title>
    <link rel="stylesheet" href="/static/css/anthropic-brand.css">
    <link rel="stylesheet" href="/static/css/chip/chip_compare_branded.css">
    <link rel="stylesheet" href="/static/css/editormd.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Header Section -->
    <header class="anthropic-header">
        <div class="header-top">
            <a href="/" class="brand-logo">
                <i class="fas fa-microchip"></i>
                <span>CHIP</span>
                <span class="subtitle">Pin2Pin Analysis Platform</span>
            </a>
            <nav class="quick-nav">
                <a href="/" class="nav-link"><i class="fas fa-home"></i> 首页</a>
                <a href="/search" class="nav-link"><i class="fas fa-search"></i> 搜索</a>
                <a href="/chip/compare" class="nav-link active"><i class="fas fa-exchange-alt"></i> Pin2Pin对比</a>
            </nav>
        </div>
    </header>

    <!-- Main Container -->
    <div class="compare-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-section">
                <h2 class="sidebar-title">
                    <i class="fas fa-cog"></i>
                    分析设置
                </h2>

                <!-- API Model Selection -->
                <div class="setting-group">
                    <label class="setting-label">
                        <i class="fas fa-robot"></i>
                        大模型API选择
                    </label>
                    <select id="apiModelDropdown" class="styled-select">
                        <option value="deepseek-v4-flash" selected>DeepSeek V4 Flash（推荐）</option>
                        <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
                        <option value="gpt-4o">OpenAI GPT-4o</option>
                    </select>
                </div>

                <!-- Output Format -->
                <div class="setting-group">
                    <label class="setting-label">
                        <i class="fas fa-file-export"></i>
                        输出格式
                    </label>
                    <div class="format-options">
                        <label class="checkbox-label">
                            <input type="checkbox" value="markdown" class="format" checked>
                            <span>Markdown</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" value="json" class="format">
                            <span>JSON</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" value="excel" class="format">
                            <span>Excel</span>
                        </label>
                    </div>
                </div>

                <!-- Prompt Input -->
                <div class="setting-group">
                    <label class="setting-label" for="prompt-text">
                        <i class="fas fa-terminal"></i>
                        自定义 Prompt
                    </label>
                    <textarea
                        id="prompt-text"
                        rows="10"
                        class="styled-textarea"
                        placeholder="在此输入分析使用的 Prompt..."></textarea>
                </div>

                <!-- Temperature -->
                <div class="setting-group">
                    <label class="setting-label" for="temperature">
                        <i class="fas fa-thermometer-half"></i>
                        Temperature
                    </label>
                    <div class="input-with-value">
                        <input
                            type="range"
                            id="temperature"
                            min="0"
                            max="1"
                            step="0.1"
                            value="0.3"
                            class="styled-range">
                        <span class="value-display">0.3</span>
                    </div>
                </div>

                <!-- Max Tokens -->
                <div class="setting-group">
                    <label class="setting-label" for="max-tokens">
                        <i class="fas fa-calculator"></i>
                        Max Tokens
                    </label>
                    <input
                        type="number"
                        id="max-tokens"
                        value="8192"
                        min="1"
                        step="1"
                        class="styled-input">
                </div>

                <!-- Streaming Option -->
                <div class="setting-group">
                    <label class="checkbox-label stream-toggle">
                        <input type="checkbox" id="streaming-checkbox" checked>
                        <span>
                            <i class="fas fa-stream"></i>
                            流式传输
                        </span>
                    </label>
                </div>
            </div>

            <!-- About Section -->
            <div class="sidebar-section about-section">
                <h3 class="sidebar-title">
                    <i class="fas fa-info-circle"></i>
                    关于平台
                </h3>
                <p>CHIP Pin2Pin智能替代分析平台支持硬件工程师快速进行芯片替代分析。上传芯片数据表PDF，AI自动生成专业对比报告。</p>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-area">
            <h1 class="page-title">
                <i class="fas fa-exchange-alt"></i>
                Pin2Pin智能替代分析
            </h1>
            <p class="page-description">
                上传两个或多个芯片的数据表PDF文件，AI将自动分析并生成详细的Pin2Pin对比报告
            </p>

            <!-- Upload Area -->
            <section class="upload-section">
                <h2 class="section-title">
                    <i class="fas fa-cloud-upload-alt"></i>
                    上传芯片数据表
                </h2>

                <div class="upload-dropzone">
                    <input type="file" id="file-upload" multiple accept=".pdf" hidden>
                    <label for="file-upload" class="upload-label">
                        <i class="fas fa-file-pdf"></i>
                        <span class="upload-text">点击选择文件或拖拽PDF文件到此处</span>
                        <span class="upload-hint">支持多个PDF文件上传</span>
                    </label>
                </div>

                <div class="file-list" id="fileList"></div>
            </section>

            <!-- Analyze Button -->
            <div class="action-section">
                <button class="analyze-btn btn-primary" id="analyzeBtn" disabled>
                    <i class="fas fa-microchip"></i>
                    <span class="button-text">开始AI智能分析</span>
                    <i class="fas fa-spinner fa-spin" style="display: none; margin-left: 8px;" id="btnSpinner"></i>
                </button>
            </div>

            <!-- Progress Bar -->
            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <p class="progress-text" id="progressText"></p>
            </div>

            <!-- Results Container -->
            <section class="results-section">
                <!-- Tab Header -->
                <div class="tab-header">
                    <button class="tab-btn active" data-tab="markdown">
                        <i class="fas fa-edit"></i>
                        Markdown编辑
                    </button>
                    <button class="tab-btn" data-tab="report">
                        <i class="fas fa-file-alt"></i>
                        分析报告
                    </button>
                    <button class="tab-btn" data-tab="history">
                        <i class="fas fa-history"></i>
                        历史记录
                    </button>
                </div>

                <!-- Tab Content -->
                <div class="tab-content-area">
                    <!-- Markdown Editor Tab -->
                    <div class="tab-panel active" id="markdown-panel">
                        <div id="content-editor"></div>
                    </div>

                    <!-- Analysis Report Tab -->
                    <div class="tab-panel" id="report-panel">
                        <div class="empty-state">
                            <i class="fas fa-clipboard-list"></i>
                            <p>分析报告将在这里显示</p>
                            <p class="hint">上传文件并开始分析以查看详细报告</p>
                        </div>
                    </div>

                    <!-- History Tab -->
                    <div class="tab-panel" id="history-panel">
                        <div class="empty-state">
                            <i class="fas fa-history"></i>
                            <p>最近的分析历史记录</p>
                            <p class="hint">您的分析记录将在这里显示</p>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Hidden Textarea for Editor -->
    <textarea style="display:none;" id="content_hidden"></textarea>

    <!-- JavaScript Dependencies -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@3.0.7/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <script src="/static/js/editormd.min.js"></script>
    <script src="/static/js/chip/chip_compare_branded.js"></script>

    <script>
        // Temperature slider value display
        document.getElementById('temperature').addEventListener('input', function(e) {
            document.querySelector('.value-display').textContent = e.target.value;
        });

        // Tab switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const targetTab = this.dataset.tab;

                // Remove active class from all tabs and panels
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));

                // Add active class to clicked tab and corresponding panel
                this.classList.add('active');
                document.getElementById(targetTab + '-panel').classList.add('active');
            });
        });

        // File upload handling
        const fileUpload = document.getElementById('file-upload');
        const fileList = document.getElementById('fileList');
        const analyzeBtn = document.getElementById('analyzeBtn');

        fileUpload.addEventListener('change', function(e) {
            fileList.innerHTML = '';
            const files = Array.from(e.target.files);

            if (files.length > 0) {
                analyzeBtn.disabled = false;
                files.forEach((file, index) => {
                    const fileItem = document.createElement('div');
                    fileItem.className = 'file-item';
                    fileItem.innerHTML = `
                        <i class="fas fa-file-pdf"></i>
                        <span class="file-name">${file.name}</span>
                        <span class="file-size">${(file.size / 1024 / 1024).toFixed(2)} MB</span>
                        <button class="remove-file" onclick="removeFile(${index})">
                            <i class="fas fa-times"></i>
                        </button>
                    `;
                    fileList.appendChild(fileItem);
                });
            } else {
                analyzeBtn.disabled = true;
            }
        });

        function removeFile(index) {
            // Implementation for removing file
            console.log('Remove file at index:', index);
        }

        // Drag and drop
        const dropzone = document.querySelector('.upload-dropzone');

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropzone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropzone.addEventListener(eventName, () => {
                dropzone.classList.add('dragover');
            });
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropzone.addEventListener(eventName, () => {
                dropzone.classList.remove('dragover');
            });
        });

        dropzone.addEventListener('drop', function(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            fileUpload.files = files;
            fileUpload.dispatchEvent(new Event('change'));
        });
    </script>
</body>
</html>
