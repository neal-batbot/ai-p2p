<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{layouts/base :: head-common}"></th:block>
    <title th:text="${article.title} + ' | Barbot'">Barbot</title>
    <link rel="stylesheet" th:href="@{/static/css/article.css}">
    <link rel="stylesheet" th:href="@{/static/css/editormd.preview.min.css}">
</head>
<body class="ba-article-page">
<nav th:replace="~{layouts/base :: navbar}"></nav>

<main class="ba-article-main">
    <article class="ba-article-shell">
        <a class="ba-article-back" href="/blog">← 返回 Barbot Newsletter</a>
        <p class="ba-article-eyebrow">BARBOT / INSIGHT</p>
        <h1 th:text="${article.title}">文章标题</h1>
        <p class="ba-article-subtitle" th:if="${article.subtitle}" th:text="${article.subtitle}"></p>
        <div class="ba-article-meta">
            <span th:if="${article.author}" th:text="${article.author}">Barbot</span>
            <span th:if="${article.createTime}" th:text="${article.createTime}">2026-01-01</span>
            <span th:if="${article.tag}" th:text="${article.tag}">行业洞察</span>
        </div>
        <div class="ba-article-rule"></div>
        <div id="md-view" class="ba-article-content">
            <textarea id="markdown-content" hidden th:text="${article.content ?: article.contentText}"></textarea>
        </div>
    </article>
</main>

<footer th:replace="~{layouts/base :: footer}"></footer>
<th:block th:replace="~{layouts/base :: scripts-common}"></th:block>
<script th:src="@{/static/lib/marked.min.js}"></script>
<script th:src="@{/static/lib/prettify.min.js}"></script>
<script th:src="@{/static/js/editormd.min.js}"></script>
<script>
    $(function () {
        const markdown = $("#markdown-content").text().trim();
        const target = $("#md-view");

        if (!markdown) {
            target.html('<p class="ba-article-empty">这篇文章暂未提供正文。</p>');
            return;
        }

        editormd.markdownToHTML("md-view", {
            markdown: markdown,
            htmlDecode: "style,script,iframe",
            emoji: true,
            taskList: true,
            tex: true,
            flowChart: true,
            sequenceDiagram: true,
            previewCodeHighlight: true,
            toc: true,
            tocStartLevel: 2,
            path: "/static/lib/"
        });
    });
</script>
</body>
</html>
