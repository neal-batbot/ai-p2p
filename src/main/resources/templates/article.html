            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #0a192f;
            --secondary: #112240;
            --accent: #64ffda;
            --text: #ccd6f6;
            --text-light: #a8b2d1;

        }

        body {

            left: 0;

        }

        /* 导航栏 */

        .logo {

        .logo i {
            color: var(--accent);

        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            color: var(--text-light);
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 500;
            transition: color 0.3s;
            position: relative;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--accent);
        }

        .nav-links a::after {
            content: "";
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            transition: width 0.3s;
        }

        .nav-links a:hover::after,

        /* 响应式设计 */
        @media (max-width: 768px) {

            .blog-header h1 {

        /* 回到顶部按钮 */

        }

        .back-to-top.show {
            opacity: 1;
            transform: translateY(0);
        }

<script>
    $(document).ready(function () {
        // 移动端菜单切换
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const mobileMenu = document.getElementById('mobileMenu');
        const mobileMenuOverlay = document.getElementById('mobileMenuOverlay');

        function toggleMobileMenu() {
            mobileMenu.classList.toggle('active');
            mobileMenuOverlay.classList.toggle('active');
            document.body.style.overflow = mobileMenu.classList.contains('active') ? 'hidden' : '';
        }

        mobileMenuBtn.addEventListener('click', toggleMobileMenu);
        mobileMenuOverlay.addEventListener('click', toggleMobileMenu);

        // 回到顶部按钮
        $(window).scroll(function () {
            if ($(this).scrollTop() > 300) {
                $('.back-to-top').addClass('show');
            } else {
                $('.back-to-top').removeClass('show');
            }
        });

        $('.back-to-top').click(function () {
            $('html, body').animate({scrollTop: 0}, 800);
            return false;
        });

        // 导航栏滚动效果
        $(window).scroll(function () {
            if ($(this).scrollTop() > 100) {
                $('.navbar').css('padding', '0.8rem 5%');
            } else {
                $('.navbar').css('padding', '1rem 5%');
            }
        });

        // 初始化Editor.md
        var editor = editormd.markdownToHTML("md-view", {
            markdown: md,
            htmlDecode: "style,script,iframe",
            emoji: true,
            taskList: true,
            tex: true,
            flowChart: true,
            sequenceDiagram: true,
            previewCodeHighlight: true,
            toc: true,
            tocStartLevel: 2,
            tocTitle: "文章目录",
            tocContainer: "#custom-toc-container",
            tocDropdown: true,
            theme: "dark",
            editorTheme: "pastel-on-dark",
            path: "https://cdn.jsdelivr.net/npm/editor.md@1.5.0/lib/"
        });

        // 添加自定义样式到渲染后的内容
        setTimeout(function () {
            // 添加图片说明样式
            $(".editormd-html-preview em").each(function () {
                if ($(this).text().startsWith("图")) {
                    $(this).addClass("image-caption");
                    $(this).css({
                        "display": "block",
                        "text-align": "center",
                        "font-style": "italic",
                        "color": "#a8b2d1",
                        "margin-top": "-1.5rem",
                        "margin-bottom": "2rem",
                        "font-size": "0.95rem"
                    });
                }
            });

            // 添加高亮框样式
            $(".editormd-html-preview strong").each(function () {
                if ($(this).text().includes("核心洞察：")) {
                    $(this).parent().wrap('<div class="highlight-box"></div>');
                    $(".highlight-box").css({
                        "background": "var(--secondary)",
                        "padding": "1.5rem",
                        "border-radius": "8px",
                        "margin": "2rem 0",
                        "border-left": "4px solid var(--accent)"
                    });
                }
            });
        }, 500);

    });

    var md = $("#markdown-content").text();

</script>
