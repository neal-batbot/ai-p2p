<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>500 - 服务器错误</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: radial-gradient(circle at center, #1f1f1f 0%, #0d0d0d 100%);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            overflow: hidden;
        }

        .center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            animation: fadeIn 2s ease;
        }

        .error-code {
            font-size: 6rem;
            font-weight: bold;
            background: linear-gradient(90deg, #ff416c, #ff4b2b, #ff416c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: pulse 2s infinite ease-in-out;
        }

        .message {
            font-size: 1.5rem;
            margin-top: 10px;
            opacity: 0.85;
        }

        .button {
            margin-top: 30px;
            display: inline-block;
            padding: 10px 25px;
            border: 1px solid #fff;
            border-radius: 25px;
            text-decoration: none;
            color: #fff;
            transition: background 0.3s, color 0.3s;
        }

        .button:hover {
            background: #fff;
            color: #111;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translate(-50%, -55%); }
            100% { opacity: 1; transform: translate(-50%, -50%); }
        }

        @keyframes pulse {
            0% { text-shadow: 0 0 10px rgba(255, 65, 108, 0.3); }
            50% { text-shadow: 0 0 20px rgba(255, 75, 43, 0.7); }
            100% { text-shadow: 0 0 10px rgba(255, 65, 108, 0.3); }
        }
    </style>
</head>
<body>
<div class="center">
    <div class="error-code">500</div>
    <div class="message">服务器出错了，请稍后再试。</div>
    <a class="button" href="/">返回首页</a>
</div>
</body>
</html>
