<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbarbot</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: white; padding: 10px 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .search-container { display: flex; align-items: center; justify-content: center; flex-grow: 1; }
        .search-box { width: 350px; margin-right: 20px; }
        .search-box input { width: 100%; padding: 6px; border: 1px solid #ccc; border-radius: 5px; }
        .nav-bar { background: red; color: white; padding: 10px; display: flex; justify-content: space-around; position: relative; }
        .nav-item { position: relative; cursor: pointer; padding: 10px; }
        .sub-menu { display: none; position: absolute; top: 100%; left: 0; background: white; color: black; min-width: 150px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 10;}
        .sub-menu div { padding: 10px; cursor: pointer; }
        .sub-menu div:hover { background: #f0f0f0; }
        .nav-item:hover .sub-menu { display: block; }
        .carousel { position: relative; width: 100%; max-width: 1200px; margin: 20px auto; overflow: hidden; }
        .carousel img { width: 100%; display: none; }
        .carousel img.active { display: block; }
        .carousel-controls { text-align: center; margin-top: 10px; }
        .carousel-controls span { cursor: pointer; padding: 5px; border: 1px solid black; margin: 2px; }
        button { background: red; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-size: 14px; }
        button:hover { background: darkred; }
    </style>
</head>
<body>
<div class="top-bar">
    <h1 style="color: red;">Chatbarbot</h1>
    <div class="search-container">
        <div class="search-box"><input type="text" id="searchInput" placeholder="Search..."></div>
        <button onclick="search()">搜索</button>
    </div>
</div>

<div class="nav-bar">
    <div class="nav-item">Products
        <div class="sub-menu">
            <div>Chips</div>
            <div>Sensors</div>
            <div>Microcontrollers</div>
        </div>
    </div>
    <div class="nav-item">Applications
        <div class="sub-menu">
            <div>Automotive</div>
            <div>Industrial</div>
            <div>Consumer</div>
        </div>
    </div>
    <div class="nav-item">Design & Development</div>
    <div class="nav-item">Quality & Reliability</div>
    <div class="nav-item">Ordering Resources</div>
    <div class="nav-item">About TI</div>
</div>

<div class="carousel">
    <img src="/img/img1.webp" class="active">
    <img src="/img/img2.webp">
    <img src="/img/img3.jpeg">
</div>
<div class="carousel-controls">
    <span onclick="prevSlide()">❮</span>
    <span onclick="nextSlide()">❯</span>
</div>

<script src="/js/jquery.min.js"></script>
<script>
    let currentSlide = 0;
    const slides = document.querySelectorAll(".carousel img");

    function showSlide(index) {
        slides.forEach((slide, i) => slide.classList.toggle("active", i === index));
    }

    function nextSlide() {
        currentSlide = (currentSlide + 1) % slides.length;
        showSlide(currentSlide);
    }

    function prevSlide() {
        currentSlide = (currentSlide - 1 + slides.length) % slides.length;
        showSlide(currentSlide);
    }
    setInterval(nextSlide, 5000);

    function search() {
        const keyword = document.getElementById("searchInput").value.trim(); // 获取输入框内容
        if (keyword) {
            window.location.href = "/chip/search?content=" + encodeURIComponent(keyword); // 跳转并传递参数
        } else {
            alert("请输入搜索内容！");
        }
    }

</script>
</body>
</html>
